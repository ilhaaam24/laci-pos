<!-- 1. BILL (Tagihan / Open Bill Kasir) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Papan Klip Penjepit Tagihan (Clipboard base) -->
  <rect x="9" y="8" width="30" height="36" rx="4" stroke="#1E293B" stroke-width="2.5" fill="#E6F5EE"/>
  
  <!-- Penjepit Nota Kasir (Bill Clip Atas) -->
  <path d="M19 8V6C19 4.9 19.9 4 21 4H27C28.1 4 29 4.9 29 6V8" stroke="#1E293B" stroke-width="2.2" fill="#FFFFFF"/>
  <circle cx="24" cy="6.5" r="1.2" fill="#009951"/>

  <!-- Kertas Tagihan / Bill Lembaran -->
  <rect x="14" y="14" width="20" height="24" rx="2" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.8"/>

  <!-- Baris Rincian Pesanan Tagihan -->
  <line x1="18" y1="19" x2="26" y2="19" stroke="#1E293B" stroke-width="2"/>
  <line x1="28" y1="19" x2="30" y2="19" stroke="#94A3B8" stroke-width="2"/>

  <line x1="18" y1="24" x2="24" y2="24" stroke="#1E293B" stroke-width="2"/>
  <line x1="28" y1="24" x2="30" y2="24" stroke="#94A3B8" stroke-width="2"/>

  <!-- Garis Pemisah Total Tagihan -->
  <line x1="17" y1="29" x2="31" y2="29" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="2 2"/>

  <!-- Total Nominal Bill (Aksen Hijau POS) -->
  <line x1="18" y1="33" x2="23" y2="33" stroke="#009951" stroke-width="2.5"/>
  <line x1="26" y1="33" x2="30" y2="33" stroke="#009951" stroke-width="2.5"/>
</svg>
