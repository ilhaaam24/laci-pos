<!-- 2. EMAIL (email.svg) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Badan Amplop Surat -->
  <rect x="6" y="11" width="36" height="26" rx="4" stroke="#1E293B" stroke-width="2.5" fill="#E6F5EE"/>

  <!-- Lipatan Penutup Atas Amplop -->
  <path d="M6 14L24 27L42 14" stroke="#1E293B" stroke-width="2.5"/>

  <!-- Lipatan Sisi Dalam Bawah -->
  <line x1="6" y1="36" x2="17" y2="25" stroke="#94A3B8" stroke-width="1.8"/>
  <line x1="42" y1="36" x2="31" y2="25" stroke="#94A3B8" stroke-width="1.8"/>

  <!-- Badge Simbol '@' Email Hijau Brand di Bagian Kanan Bawah -->
  <g transform="translate(26, 22)">
    <circle cx="11" cy="11" r="9" fill="#009951" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M11 14.5C8.8 14.5 7.5 13 7.5 11C7.5 8.8 9.1 7.2 11.5 7.2C13.8 7.2 15.2 8.7 15.2 10.8V12.2C15.2 12.9 14.8 13.5 14 13.5C13.2 13.5 12.8 12.9 12.8 12.2V9.8" 
          stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="11" cy="11" r="1.8" fill="#FFFFFF"/>
  </g>
</svg>
