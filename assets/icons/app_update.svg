<svg width="160" height="160" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGlow" x1="20" y1="16" x2="140" y2="144" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#009951" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="drawerGrad" x1="32" y1="74" x2="122" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#05AD5E"/>
      <stop offset="100%" stop-color="#008A48"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="98" y1="22" x2="140" y2="66" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#009951"/>
    </linearGradient>
    <linearGradient id="topBodyGrad" x1="40" y1="40" x2="114" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Soft outer halo (works in both light & dark mode) -->
  <circle cx="80" cy="82" r="64" fill="url(#bgGlow)"/>
  <circle cx="80" cy="82" r="52" stroke="#009951" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="4 5"/>

  <!-- Subtle ground shadow -->
  <ellipse cx="77" cy="134" rx="44" ry="6" fill="#0F172A" fill-opacity="0.12"/>

  <!-- Top receipt/handle tab (signature Laci POS motif) -->
  <rect x="61" y="34" width="32" height="12" rx="5" fill="#009951"/>
  <rect x="69" y="39" width="16" height="2.4" rx="1.2" fill="#FFFFFF" fill-opacity="0.9"/>

  <!-- Upper POS terminal body -->
  <path d="M40 58C40 49.1634 47.1634 42 56 42H98C106.837 42 114 49.1634 114 58V80H40V58Z" fill="url(#topBodyGrad)"/>

  <!-- Three keypad/display tiles on upper body -->
  <rect x="47" y="51" width="17" height="17" rx="4.5" fill="#334155" fill-opacity="0.75"/>
  <circle cx="55.5" cy="59.5" r="3.4" fill="#FFFFFF"/>

  <rect x="68.5" y="51" width="17" height="17" rx="4.5" fill="#334155" fill-opacity="0.75"/>
  <rect x="73" y="58.2" width="8" height="2.6" rx="1.3" fill="#10B981"/>

  <rect x="90" y="51" width="17" height="17" rx="4.5" fill="#334155" fill-opacity="0.75"/>
  <circle cx="98.5" cy="59.5" r="3.4" fill="#FFFFFF"/>

  <!-- Front cash drawer (signature Laci POS green) -->
  <rect x="30" y="75" width="94" height="50" rx="14" fill="url(#drawerGrad)"/>
  <!-- Subtle top highlight on drawer -->
  <path d="M44 76.5H110" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2" stroke-linecap="round"/>

  <!-- White 'L' brand mark -->
  <path d="M48 89V109C48 110.657 49.3431 112 51 112H71" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Drawer handle slot & three status dots -->
  <rect x="83" y="92" width="27" height="6" rx="3" fill="#0F172A"/>
  <circle cx="87.5" cy="108.5" r="3.2" fill="#FFFFFF"/>
  <circle cx="96.5" cy="108.5" r="3.2" fill="#FFFFFF"/>
  <circle cx="105.5" cy="108.5" r="3.2" fill="#FFFFFF"/>

  <!-- Floating Update Badge (top-right) -->
  <circle cx="119" cy="43" r="24" fill="#FFFFFF" fill-opacity="0.95"/>
  <circle cx="119" cy="43" r="20.5" fill="url(#badgeGrad)"/>
  <!-- Upward arrow inside badge -->
  <path d="M119 52V35" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M111.5 41.5L119 34L126.5 41.5" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Decorative sparkles -->
  <!-- Top-left 4-point star -->
  <path d="M31 36L32.8 40.2L37 42L32.8 43.8L31 48L29.2 43.8L25 42L29.2 40.2L31 36Z" fill="#009951"/>
  <!-- Mid-left soft sky dot -->
  <circle cx="24" cy="64" r="3.5" fill="#0EA5E9" fill-opacity="0.7"/>
  <!-- Bottom-right 4-point star -->
  <path d="M136 92L137.4 95.6L141 97L137.4 98.4L136 102L134.6 98.4L131 97L134.6 95.6L136 92Z" fill="#10B981"/>
  <!-- Small accent dots -->
  <circle cx="141" cy="70" r="2.5" fill="#F59E0B" fill-opacity="0.85"/>
  <circle cx="38" cy="128" r="2.5" fill="#009951" fill-opacity="0.5"/>
</svg>

