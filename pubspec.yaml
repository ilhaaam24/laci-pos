name: laci
description: "A new Flutter project."
version: 1.0.0+7
publish_to: "none" # Remove this line if you wish to publish to pub.dev

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # State Management
  flutter_bloc: ^8.1.3
  bloc: ^8.1.2
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^7.6.4
  injectable: ^2.3.2

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.1
  google_sign_in: ^7.2.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.3.11

  # Image
  image_picker: ^1.1.0
  cached_network_image: ^3.3.0

  # PDF & Printing
  pdf: ^3.10.7
  printing: ^5.11.1
  print_bluetooth_thermal: 1.1.9
  esc_pos_utils_plus: ^2.0.3

  # Utils
  intl: ^0.18.1
  uuid: ^4.1.0
  dartz: ^0.10.1
  google_fonts: ^8.0.2
  flutter_animate: ^4.5.2
  cherry_toast: ^1.1.0
  permission_handler: ^11.3.1
  fl_chart: ^0.66.0
  month_picker_dialog: ^6.7.2
  syncfusion_flutter_datepicker: ^25.1.37
  flutter_local_notifications: ^21.0.0
  workmanager: ^0.10.10

  # Offline / Local Database
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0
  connectivity_plus: ^6.1.0

  cloudinary_api: ^1.1.1
  cloudinary_url_gen: ^1.8.0
  dio: ^5.9.2
  url_launcher: ^6.3.2
  flutter_svg: ^2.3.0
  mobile_scanner: ^7.4.2
  flutter_native_splash: ^2.4.8
  shared_preferences: ^2.5.5
  screenshot: ^3.0.0
  share_plus: ^13.3.0
  image: ^4.10.1
  tutorial_coach_mark: ^1.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.6
  injectable_generator: ^2.4.0
  bloc_test: ^9.1.5
  drift_dev: ^2.22.2
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.14.4"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 16 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true

flutter:
  uses-material-design: true
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  assets:
    - assets/images/
    - assets/icons/
