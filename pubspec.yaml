name: laci
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # State Management
  flutter_bloc: ^8.1.3
  bloc: ^8.1.2
  equatable: ^2.0.5
  
  # Dependency Injection
  get_it: ^7.6.4
  injectable: ^2.3.2
  
  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.1
  google_sign_in: ^7.2.0
  cloud_firestore: ^5.5.4
  firebase_storage: ^12.3.11
  
  # Image
  image_picker: ^1.1.0
  cached_network_image: ^3.3.0
  
  # PDF & Printing
  pdf: ^3.10.7
  printing: ^5.11.1
  print_bluetooth_thermal: 1.1.9
  esc_pos_utils_plus: ^2.0.3
  
  # Utils
  intl: ^0.18.1
  uuid: ^4.1.0
  dartz: ^0.10.1
  google_fonts: ^8.0.2
  flutter_animate: ^4.5.2
  cherry_toast: ^1.1.0
  permission_handler: ^11.3.1
  fl_chart: ^0.66.0
  month_picker_dialog: ^6.7.2
  syncfusion_flutter_datepicker: ^25.1.37
  flutter_local_notifications: ^21.0.0
  workmanager: ^0.9.0+3
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.6
  injectable_generator: ^2.4.0
  bloc_test: ^9.1.5



  flutter_lints: ^6.0.0


